<style>

  color: #222;
  min-height: 100vh;

}
header { text-align: center; margin-bottom: 30px; }
.logo {
  display: inline-flex; align-items: center; gap: 10px;
  background: #ffeb3b; border: 4px solid #000; border-radius: 20px;
  padding: 10px 20px; box-shadow: 6px 6px 0 #000;

.logo svg { width: 60px; height: 60px; }

.btn.primary { background: #ff5722; color: white; }

.container { max-width: 900px; margin: 0 auto; text-align: center; }
#preview-container {
  margin: 30px auto; position: relative; display: none;
  border: 5px solid #000; border-radius: 15px; box-shadow: 8px 8px 0 #000;
  background: white; overflow: hidden; max-width: 100%;
}
#memeImg, canvas { display: block; max-width: 100%; height: auto; margin: 0 auto; }

  font-family: 'Comic Neue', cursive; font-size: 1.2rem; padding: 10px;
  border: 3px solid #000; border-radius: 10px; width: 100%; max-width: 600px;
  margin: 15px auto; display: block; background: #fffde7;
}
.footer { margin-top: 40px; font-size: 0.9rem; color: #777; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 30 Q50 10 80 30 L85 60 Q50 90 15 60 Z" fill="#ff5722" stroke="#000" stroke-width="4"/>
      <text x="50" y="55" font-family="Bangers" font-size="28" fill="white" text-anchor="middle">PB</text>
      <circle cx="35" cy="45" r="4" fill="#000"/>
      <circle cx="65" cy="45" r="4" fill="#000"/>
    </svg>
    Punny Boom
  </div>
  <h1>Comic Double Meaning Memes</h1>
  <p class="subtitle">Auto-generate on viral templates or upload your pic!</p>
</header>

<div class="container">
  <div class="buttons">
    <button class="btn primary" id="autoBtn">Auto Generate Fun Meme</button>
    <button class="btn secondary" id="uploadBtn">Upload Your Picture</button>
  </div>

  <input type="file" id="fileInput" accept="image/*">

  <div id="preview-container">
    <img id="memeImg" alt="Generated meme" style="display:none;">
    <canvas id="memeCanvas" width="800" height="600" style="display:none;"></canvas>
  </div>

  <div class="controls" id="controls">
    <input type="text" class="caption-input" id="captionInput" placeholder="Edit caption...">
    <button class="btn" id="regenerateBtn">Regenerate</button>
    <button class="btn primary" id="downloadBtn">Export Meme 📥</button>
  </div>
</div>

<footer class="footer">
  Made with comic power • Double meanings that hit different
</footer>

<script>
const canvas = document.getElementById('memeCanvas');
const ctx = canvas.getContext('2d');
const memeImg = document.getElementById('memeImg');
const preview = document.getElementById('preview-container');
const controls = document.getElementById('controls');
const autoBtn = document.getElementById('autoBtn');
const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const captionInput = document.getElementById('captionInput');
const regenerateBtn = document.getElementById('regenerateBtn');
const downloadBtn = document.getElementById('downloadBtn');

let currentMode = 'auto';
let currentCaption = '';
let currentImage = null;

const captions = [
  "I told my wife she was drawing her eyebrows too high. She looked surprised.",
  "Why don't scientists trust atoms? Because they make up everything!",
  "I'm reading a book about anti-gravity. It's impossible to put down!",
  "Did you hear about the mathematician who's afraid of negative numbers? He'll stop at nothing to avoid them.",
  "I used to be a baker, but I couldn't make enough dough.",
  "Why did the scarecrow win an award? Because he was outstanding in his field!",
  "I told my computer I needed a break, and now it won't stop sending me KitKat ads.",
  "Why do programmers prefer dark mode? Because light attracts bugs!",
  "I asked the librarian if the library had any books on paranoia. She whispered, 'They're right behind you.'",
  "My wife said I never take her anywhere expensive. So I took her to a gas station.",
  "Why don't eggs tell jokes? They'd crack each other up!",
  "I used to hate facial hair, but then it grew on me.",
  "What do you call a fake noodle? An impasta!",
  "Why did the bicycle fall over? Because it was two-tired!",
  "I'm on a seafood diet. I see food and I eat it.",
  "Why don't skeletons fight each other? They don't have the guts!",
  "What did the ocean say to the beach? Nothing, it just waved.",
  "Why did the tomato turn red? Because it saw the salad dressing!",
  "What do you call a pile of cats? A meowntain!",
  "Why did the coffee file a police report? It got mugged!",
  "I told my plants a joke. They didn't laugh, but they did grow on me.",
  "Why don't oysters share? Because they're shellfish!",
  "What do you get when you cross a snowman with a vampire? Frostbite!",
  "I'm trying to organize a hide and seek tournament, but good players are really hard to find.",
  "Why did the golfer bring two pairs of pants? In case he got a hole in one!",
  "I used to be a banker, but I lost interest.",
  "What do you call cheese that isn't yours? Nacho cheese!",
  "Why was the belt arrested? For holding up a pair of pants!",
  "Why don't scientists trust stairs? Because they're always up to something!",
  "What did one wall say to the other wall? I'll meet you at the corner!",
  "Why did the cookie go to the doctor? Because it felt crummy!",
  "I'm on a whiskey diet. I've lost three days already.",
  "What do you call a bear with no teeth? A gummy bear!",
  "Why did the picture go to jail? Because it was framed!",
  "I asked the gym instructor if he could teach me to do splits. He said how flexible are you?",
  "She said she wanted a workout. I offered my personal training services.",
  "He said he needed space. I offered my bed.",
  "I told her I'm a carpenter. She asked if I was good with my wood.",
  "She said she's into tech. I asked if she wanted to try my joystick.",
  "My boss told me to raise the bar. I brought him to the pub.",
  "She said she liked deep conversations. I took her to the ocean.",
  "Double standards are the worst. I mean one flag is enough.",
  "A beautiful woman walks into a bar. I'll have a double entendre she said."
];

const templates = [
  { id: 'drake', lines: 2 },
  { id: 'db', lines: 3 },
  { id: 'fine', lines: 2 },
  { id: 'success', lines: 2 },
  { id: 'fry', lines: 2 },
  { id: 'wonka', lines: 2 },
  { id: 'yuno', lines: 2 },
  { id: 'blb', lines: 2 },
  { id: 'buzz', lines: 2 },
  { id: 'ds', lines: 3 },
  { id: 'changemind', lines: 1 },
  { id: 'rollsafe', lines: 2 },
  { id: 'pigeon', lines: 2 },
  { id: 'astronaut', lines: 2 },
  { id: 'pooh', lines: 2 },
  { id: 'harold', lines: 2 },
  { id: 'woman-cat', lines: 2 },
  { id: 'spiderman', lines: 2 }
];

function getRandomCaption() {
  return captions[Math.floor(Math.random() * captions.length)];
}

function getRandomTemplate() {
  return templates[Math.floor(Math.random() * templates.length)];
}

function encodeForMemegen(text) {
  return text.replace(/ /g, '_').replace(/'/g, "''").replace(/\?/g, '~q').replace(/\//g, '~s');
}

function generateMemegenUrl(templateId, caption) {
  const parts = caption.split(/\. |! |\? /).filter(p => p.trim());
  let top = '', bottom = '';
  if (parts.length >= 2) {
    top = parts[0];
    bottom = parts.slice(1).join('. ');
  } else {
    top = caption;
    bottom = '_';
  }
  const topEnc = encodeForMemegen(top);
  const bottomEnc = encodeForMemegen(bottom);
  return `https://api.memegen.link/images/${templateId}/${topEnc}/${bottomEnc}.jpg?font=impact`;
}

function showMemegenMeme(url, caption) {
  currentCaption = caption;
  captionInput.value = caption;
  memeImg.src = url;
  memeImg.style.display = 'block';
  canvas.style.display = 'none';
  preview.style.display = 'inline-block';
  controls.style.display = 'flex';
}

function drawComicBackground() {
  ctx.fillStyle = '#fff8dc';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(255, 193, 7, 0.3)';
  for (let x = 0; x < canvas.width; x += 12) {
    for (let y = 0; y < canvas.height; y += 12) {
      if (Math.random() > 0.7) {
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 12;
  ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
}

function drawText(text, isTop = true) {
  const maxWidth = canvas.width - 80;
  const fontSize = Math.min(56, maxWidth / (text.length * 0.55));
  ctx.font = `bold ${fontSize}px 'Bangers', cursive`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const words = text.split(' ');
  const lines = [];
  let currentLine = words[0] || '';
  for (let i = 1; i < words.length; i++) {
    const test = currentLine + ' ' + words[i];
    if (ctx.measureText(test).width > maxWidth) {
      lines.push(currentLine);
      currentLine = words[i];
    } else currentLine = test;
  }
  if (currentLine) lines.push(currentLine);
  const lineHeight = fontSize * 1.15;
  const totalH = lines.length * lineHeight;
  let y = isTop ? 80 + totalH / 2 : canvas.height - 80 - totalH / 2;
  lines.forEach((line, i) => {
    const ly = y + (i - lines.length / 2) * lineHeight;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 7;
    ctx.strokeText(line, canvas.width / 2, ly);
    ctx.fillStyle = '#fff';
    ctx.fillText(line, canvas.width / 2, ly);
  });
}

function drawWatermark() {
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = '#ff5722';
  ctx.beginPath();
  ctx.arc(canvas.width - 165, canvas.height - 28, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = "bold 11px Bangers";
  ctx.textAlign = 'center';
  ctx.fillText("PB", canvas.width - 165, canvas.height - 25);
  ctx.fillStyle = '#000';
  ctx.font = "bold 13px 'Comic Neue', cursive";
  ctx.textAlign = 'right';
  ctx.fillText("Generated by Punny Boom", canvas.width - 18, canvas.height - 14);
  ctx.restore();
}

function renderUploadMeme(image, caption) {
  if (!caption) caption = getRandomCaption();
  currentCaption = caption;
  captionInput.value = caption;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (image) {
    const scale = Math.max(canvas.width / image.width, canvas.height / image.height);
    const x = (canvas.width - image.width * scale) / 2;
    const y = (canvas.height - image.height * scale) / 2;
    ctx.drawImage(image, x, y, image.width * scale, image.height * scale);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    drawComicBackground();
  }
  const parts = caption.split(/\. |! |\? /);
  if (parts.length >= 2 && caption.length > 50) {
    drawText(parts[0] + '.', true);
    drawText(parts.slice(1).join('. '), false);
  } else {
    drawText(caption, true);
  }
  drawWatermark();
  memeImg.style.display = 'none';
  canvas.style.display = 'block';
  preview.style.display = 'inline-block';
  controls.style.display = 'flex';
}

autoBtn.addEventListener('click', () => {
  currentMode = 'auto';
  currentImage = null;
  const caption = getRandomCaption();
  const tpl = getRandomTemplate();
  const url = generateMemegenUrl(tpl.id, caption);
  showMemegenMeme(url, caption);
});

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      currentImage = img;
      currentMode = 'upload';
      renderUploadMeme(img);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

regenerateBtn.addEventListener('click', () => {
  if (currentMode === 'auto') {
    const caption = getRandomCaption();
    const tpl = getRandomTemplate();
    const url = generateMemegenUrl(tpl.id, caption);
    showMemegenMeme(url, caption);
  } else {
    renderUploadMeme(currentImage, getRandomCaption());
  }
});

captionInput.addEventListener('input', () => {
  if (currentMode === 'upload') {
    renderUploadMeme(currentImage, captionInput.value);
  }
});

downloadBtn.addEventListener('click', () => {
  if (currentMode === 'auto' && memeImg.src) {
    const a = document.createElement('a');
    a.href = memeImg.src;
    a.download = 'punny-boom-meme.jpg';
    a.click();
  } else {
    const a = document.createElement('a');
    a.download = 'punny-boom-meme.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }
});
</script>
</body>
